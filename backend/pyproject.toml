[project]
name = "market-tracker-backend"
version = "0.1.0"
description = "Backend de MarketTracker: API FastAPI + worker de ingestión."
requires-python = ">=3.12"

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "alembic"

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic contiene plantillas/entorno autogenerados; se excluye del linting.
extend-exclude = ["alembic"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear, C4 comprehensions
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # longitud de línea la gestiona black
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
