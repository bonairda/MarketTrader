name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: market
          POSTGRES_PASSWORD: market
          POSTGRES_DB: markettracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U market -d markettracker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_USER: market
      POSTGRES_PASSWORD: market
      POSTGRES_DB: markettracker
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      RUN_DB_TESTS: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Ruff (lint)
        run: ruff check .

      # No bloqueante: el formato con black se aplica en local (`black .`).
      # Se deja el check como informativo para no romper el CI por estilo.
      - name: Black (format check)
        run: black --check .
        continue-on-error: true

      - name: Pytest
        run: pytest -q

      # Verifica que la imagen contiene app + configuración/scripts de Alembic.
      - name: Build backend image
        run: docker build .

  app:
    name: App Flutter (analyze)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Genera las carpetas de plataforma (no versionadas) y resuelve dependencias.
      - name: Prepare project
        run: |
          flutter create .
          flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
