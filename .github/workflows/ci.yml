name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.16.1-pg16
        env:
          POSTGRES_USER: market
          POSTGRES_PASSWORD: market
          POSTGRES_DB: markettracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U market -d markettracker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_USER: market
      POSTGRES_PASSWORD: market
      POSTGRES_DB: markettracker
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      RUN_DB_TESTS: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment scripts
        working-directory: .
        run: |
          shellcheck deploy/*.sh deploy/backup/*.sh app/docker-entrypoint.d/*.sh

      - name: Render production Compose
        working-directory: .
        run: |
          cat > /tmp/markettracker-production.env <<'EOF'
          POSTGRES_USER=market
          POSTGRES_PASSWORD=ci-postgres-password-123456
          POSTGRES_DB=markettracker
          REDIS_PASSWORD=ci-redis-password-123456789
          JWT_SECRET=ci-jwt-secret-123456789012345678901234567890
          CORS_ORIGINS=https://market.example.com
          PUBLIC_API_BASE_URL=https://api.market.example.com
          STACK_NAME=markettracker-ci
          EOF
          docker compose --env-file /tmp/markettracker-production.env \
            -f compose.production.yml config >/tmp/compose.rendered.yml
          docker build deploy/backup

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Ruff (lint)
        run: ruff check .

      # No bloqueante: el formato con black se aplica en local (`black .`).
      # Se deja el check como informativo para no romper el CI por estilo.
      - name: Black (format check)
        run: black --check .
        continue-on-error: true

      - name: Pytest
        run: pytest -q

      # Verifica la misma imagen endurecida que se publica en GHCR.
      - name: Build backend production image
        run: docker build -f Dockerfile.production .

  app:
    name: App Flutter (analyze)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      # Genera las carpetas de plataforma (no versionadas) y resuelve dependencias.
      - name: Prepare project
        run: |
          flutter create .
          flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release --dart-define=REQUIRE_RUNTIME_CONFIG=true

      - name: Build web runtime image
        run: docker build -f Dockerfile.web .
